services:

  # ========================= Backend Services =========================

  # ========== Main Service ==========

  main-api:

    build:
      context: ./services/main-api
      dockerfile: Dockerfile

    pull_policy: never
    image: fantasy_league_main_api:1.0

    container_name: fl_main_api

    environment:
      ApiSports__ApiKey: ${API_SPORTS_KEY:?API_SPORTS_KEY must be set in .env}
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      RabbitMq__VirtualHost: ${RABBITMQ_DEFAULT_VHOST}

    ports:
      - "5129:8080"

    restart: unless-stopped

    networks:
      - fantasy_league_network

    depends_on:
      rabbitmq:
        condition: service_healthy


  # ========== Notification Service ==========

  notification-db:

    image: postgres:18-alpine

    container_name: fl_notification_db

    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-fantasy_league_notifications}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-postgres}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - notification-db-data:/var/lib/postgresql

    networks:
      - fantasy_league_network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-service:

    build:
      context: ./services/notification-service
      dockerfile: Dockerfile

    container_name: fl_notification_service

    environment:
      DbSettings__Host: notification-db
      DbSettings__Port: 5432
      DbSettings__Database: ${NOTIFICATION_DB_NAME:-fantasy_league_notifications}
      DbSettings__Username: ${NOTIFICATION_DB_USER:-postgres}
      DbSettings__Password: ${NOTIFICATION_DB_PASSWORD:-postgres}
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      RabbitMq__VirtualHost: ${RABBITMQ_DEFAULT_VHOST}
      MailKit__Host: ${MAILKIT_HOST:-smtp.gmail.com}
      MailKit__Port: ${MAILKIT_PORT:-587}
      MailKit__SenderEmail: ${MAILKIT_SENDER_EMAIL:-notifications@example.com}
      MailKit__SenderName: ${MAILKIT_SENDER_NAME:-Fantasy League}
      MailKit__UserName: ${MAILKIT_USERNAME:-notifications@example.com}
      MailKit__Password: ${MAILKIT_PASSWORD:-change-me}
      MailKit__UseSsl: ${MAILKIT_USE_SSL:-false}
      MailKit__TimeoutMilliseconds: ${MAILKIT_TIMEOUT_MILLISECONDS:-30000}

    pull_policy: never
    image: fantasy_league_notification_service:1.0

    networks:
      - fantasy_league_network

    depends_on:
      rabbitmq:
        condition: service_healthy
      notification-db:
        condition: service_healthy


  # ==== Web Service ====

  web:

    build:
      context: ./web
      dockerfile: Dockerfile

    pull_policy: never
    image: fantasy_league_web:1.0

    container_name: fl_web

    ports:
      - "0.0.0.0:80:80"

    depends_on:
      - main-api

    restart: unless-stopped

    networks:
      - fantasy_league_network


  # ========================= Messsage Broker Services =========================

  # RabbitMq Service

  rabbitmq:

    build:
      context: ./infrastructure/rabbitmq
      dockerfile: Dockerfile

    pull_policy: never
    image: fantasy_league_rabbitmq:1.0

    container_name: fl_rabbitmq

    networks:
      - fantasy_league_network

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ========================= Observation Services =========================

  # ======== Grafana Service ========

  grafana:

    build:
      context: ./observability/grafana
      dockerfile: Dockerfile

    pull_policy: never
    image: fantasy_league_grafana:1.0

    container_name: fl_grafana

    ports:
      - "3000:3000"

    networks:
      - fantasy_league_network

    depends_on:
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      prometheus:
        condition: service_healthy


  # ======== Alloy Service ========

  alloy:

    build:
      context: ./observability/alloy
      dockerfile: Dockerfile

    pull_policy: never
    image: fantasy_league_alloy:1.0

    container_name: fl_alloy

    ports:
      - "12345:12345"

    depends_on:
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      prometheus:
        condition: service_healthy

    networks:
      - fantasy_league_network

    restart: unless-stopped

  # ======== Prometheus Service ========

  prometheus:

    build:
      context: ./observability/prometheus
      dockerfile: Dockerfile

    pull_policy: never
    image: fantasy_league_prometheus

    container_name: fl_prometheus

    volumes:
      - prometheus-data:/prometheus

    ports:
      - "9090:9090"

    networks:
      - fantasy_league_network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ======== Loki Service ========

  loki:

    build:
      context: ./observability/loki
      dockerfile: Dockerfile

    pull_policy: never
    image: fantasy_league_loki:1.0

    container_name: fl_loki

    volumes:
      - loki-data:/loki

    networks:
      - fantasy_league_network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ======== Jaeger Service ========

  jaeger:

    build:
      context: ./observability/jaeger
      dockerfile: Dockerfile

    pull_policy: never
    image: fantasy_league_jaeger:1.0

    container_name: fl_jaeger

    networks:
      - fantasy_league_network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:13133/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


# =========== Network Configuration ===========

networks:
  fantasy_league_network:
    name: fantasy_league_network
    driver: bridge


# =========== Volume Configuration ===========

volumes:

  loki-data: {}

  prometheus-data: {}

  rabbitmq-data: {}

  notification-db-data: {}

